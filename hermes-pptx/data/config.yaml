# Hermes config — PPTX production stack
# https://hermes-agent.nousresearch.com/docs/user-guide/configuration
#
# Put secrets in .env / data/.env — never in this file.

database:
  journal_mode: "wal"

runtime:
  nofile_soft_limit: 4096

model:
  # Default: DeepSeek V4 Flash (fast/cheap).
  # Premium decks via OpenRouter:
  #   /model openrouter:anthropic/claude-opus-4.6
  # Stronger DeepSeek:
  #   /model deepseek:deepseek-v4-pro
  default: "deepseek-v4-flash"
  provider: "deepseek"
  base_url: "https://api.deepseek.com/v1"

terminal:
  backend: "local"
  cwd: "/workspace"
  timeout: 300
  lifetime_seconds: 600
  home_mode: "auto"

skills:
  write_approval: false

memory:
  write_approval: false
