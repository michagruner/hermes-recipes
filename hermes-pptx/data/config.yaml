# Hermes config — PPTX production stack
# https://hermes-agent.nousresearch.com/docs/user-guide/configuration

database:
  journal_mode: "wal"

runtime:
  nofile_soft_limit: 4096

model:
  # Default: DeepSeek V4 Flash (fast/cheap). OpenRouter still available:
  #   /model openrouter:anthropic/claude-opus-4.6
  #   /model deepseek:deepseek-v4-pro
  default: "deepseek-v4-flash"
  provider: "deepseek"
  base_url: "https://api.deepseek.com/v1"

terminal:
  backend: "local"
  cwd: "/workspace"
  timeout: 300
  lifetime_seconds: 600
  home_mode: "auto"

skills:
  write_approval: false

memory:
  write_approval: false

# grok-4.6 is a reasoning model but is not in Hermes's built-in floor list
# (only grok-4.5 / grok-4.20-reasoning). Without this, the 90s non-stream
# stale detector kills long deck-generation turns with Broken pipe.
providers:
  xai-oauth:
    models:
      grok-4.6:
        stale_timeout_seconds: 900
        timeout_seconds: 1800

agent:
  # High reasoning + a 16-slide one-shot JS file = think-phase longer than
  # xAI's idle window. Medium still reasons; it starts tools.
  reasoning_overrides:
    grok-4.6: medium
  environment_hint: |
    You have write_file and terminal. write_file MAY write under /workspace and /opt/data.
    Never say you cannot write files. Never emit a 12–16 slide build.js in one turn.
    Write the scaffold, then at most 4 slides per write_file/patch. Run node as its own
    terminal call — do not chain with && (Hermes treats " && " as backgrounding).
    Do not claim a deck is done unless ls shows /workspace/decks/<slug>.pptx.
  coding_instructions:
    - "Decks: incremental write_file of build.js (≤4 slides/turn). No && in terminal."
    - "Do not load the full officecli skill unless you are doing DOM edits."
